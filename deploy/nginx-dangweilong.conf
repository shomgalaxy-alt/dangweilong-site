# Nginx 站点配置模板：党伟隆个人网站
# 适用：Ubuntu 22.04 + Nginx，服务器直接托管 www/ 目录
# 安装位置：/etc/nginx/sites-available/dangweilong.com
# 启用：ln -s /etc/nginx/sites-available/dangweilong.com /etc/nginx/sites-enabled/
# 测试：nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name dangweilong.com www.dangweilong.com;

    # 网站根目录（部署后 www/ 的实际位置）
    root /var/www/dwl;
    index index.html;

    # 静态站点，缓存静态资源
    location / {
        try_files $uri $uri/ =404;
    }

    # 缓存规则
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # gzip 压缩（纯静态站提速明显）
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # 安全头
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}

# ===== HTTPS（可选，推荐用 certbot 自动申请） =====
# 安装: apt install certbot python3-certbot-nginx
# 申请: certbot --nginx -d dangweilong.com -d www.dangweilong.com
# certbot 会自动改写上面的 server 块并添加 443 监听
